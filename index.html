title:j[0],

company:j[1],

country:j[2],

city:j[3],

category:j[4],

type:j[5],

description:
"نتيجة بحث مرتبطة بالوظيفة المطلوبة. تحقق من تفاصيل الجهة الناشرة وشروط التقديم قبل مشاركة أي بيانات شخصية."

};

});


let allResults=[...jobData];

/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   إنشاء رابط مباشر للوظيفة
===================================================== */

function getJobURL(job){

const url=new URL(
window.location.href
);

url.search="";

url.searchParams.set(
"job",
job.id
);

return url.toString();

}


/* =====================================================
   فتح وظيفة من الرابط
===================================================== */

function openJobFromURL(){

const params=
new URLSearchParams(
window.location.search
);

const jobID=
params.get("job");

if(jobID===null){
return;
}

const job=
jobData.find(function(item){

return String(item.id)===String(jobID);

});

if(!job){
return;
}

setTimeout(function(){

openJob(job);

},500);

}


/* =====================================================
   إنشاء نتائج مخصصة
===================================================== */

function createCustomResults(
keyword,
country,
city,
type
){

const selectedCountry=
country || "saudi";

const selectedCity=
city ||
countries[selectedCountry].cities[0];

const selectedType=
type || "دوام كامل";

const result=[];

for(let i=1;i<=5;i++){

result.push({

id:"custom_"+Date.now()+"_"+i,

title:keyword,

company:
"فرصة عمل في مجال "+keyword,

country:selectedCountry,

city:selectedCity,

category:keyword,

type:selectedType,

description:
"هذه نتيجة مرتبطة ببحثك عن «"+
keyword+
"». راجع تفاصيل الجهة الناشرة وشروط التقديم قبل إتمام أي إجراء."

});

}

return result;

}

/* =====================================================
   فتح وظيفة بالـ ID
===================================================== */

function openJobByID(id){

const job=
jobData.find(function(item){

return String(item.id)===String(id);

});

if(!job){
return;
}

openJob(job);

}


/* =====================================================
   فتح تفاصيل الوظيفة
===================================================== */

function openJob(job){

currentJob=job;

document.getElementById(
"modalTitle"
).textContent=
job.title;

document.getElementById(
"modalCompany"
).textContent=
job.company;

document.getElementById(
"modalCountry"
).textContent=
countries[job.country].flag+
" "+
countries[job.country].name;

document.getElementById(
"modalCity"
).textContent=
"📍 "+job.city;

document.getElementById(
"modalType"
).textContent=
"⏱️ "+job.type;

document.getElementById(
"modalCategory"
).textContent=
"💼 "+job.category;

document.getElementById(
"modalDescription"
).textContent=
job.description;


/* عنوان الصفحة */

document.title=
job.title+
" - "+
countries[job.country].name+
" | Arab Jobs Hub";


document.getElementById(
"modal"
).classList.add("show");

}


/* =====================================================
   البحث
===================================================== */

function searchJobs(){

const keyword=
document.getElementById(
"keyword"
).value.trim();

const country=
document.getElementById(
"country"
).value;

const city=
document.getElementById(
"city"
).value;

const type=
document.getElementById(
"type"
).value;

if(!keyword){

renderJobs(
allResults.slice(0,5)
);

showToast(
"🔎 اكتب اسم الوظيفة التي تبحث عنها"
);

scrollToJobs();

return;

}

const normalized=
keyword.toLowerCase();

let result=
allResults.filter(function(job){

const text=(

job.title+
" "+
job.company+
" "+
job.category+
" "+
job.city+
" "+
countries[job.country].name

).toLowerCase();

return(

text.includes(normalized)

&&
(!country || job.country===country)

&&
(!city || job.city===city)

&&
(!type || job.type===type)

);

});


if(result.length===0){

result=
createCustomResults(
keyword,
country,
city,
type
);

}

result=result.slice(0,5);

renderJobs(result);

showToast(
"🔎 تم العثور على "+
result.length+
" اختيارات لـ: "+
keyword
);

scrollToJobs();

}


/* =====================================================
   تغيير الدولة
===================================================== */

function countryChanged(){

const country=
document.getElementById(
"country"
).value;

const city=
document.getElementById(
"city"
);

city.innerHTML=
'<option value="">🏙️ جميع المدن</option>';

if(!country)return;

countries[country].cities.forEach(
function(name){

const option=
document.createElement("option");

option.value=name;

option.textContent=
"📍 "+name;

city.appendChild(option);

});

}


/* =====================================================
   اختيار دولة
===================================================== */

function chooseCountry(country){

document.getElementById(
"country"
).value=
country;

document.getElementById(
"filterCountry"
).value=
country;

countryChanged();

const keyword=
document.getElementById(
"keyword"
).value.trim();

if(keyword){

searchJobs();

}else{

renderJobs(

allResults
.filter(function(job){

return job.country===country;

})
.slice(0,5)

);

}

scrollToJobs();

}


/* =====================================================
   الفلاتر
===================================================== */

function filterJobs(){

const country=
document.getElementById(
"filterCountry"
).value;

const category=
document.getElementById(
"filterCategory"
).value;

const type=
document.getElementById(
"filterType"
).value;

let result=
allResults.filter(function(job){

return(

(!country || job.country===country)

&&

(!category || job.category===category)

&&

(!type || job.type===type)

);

});


if(result.length===0){

const categoryName=
category || "وظيفة";

result=
createCustomResults(
categoryName,
country,
"",
type
);

}

renderJobs(
result.slice(0,5)
);

}

/* =====================================================
   تحديث
===================================================== */

const keyword=
document.getElementById(
"keyword"
).value.trim();

if(keyword){

}else{

allResults.slice(0,5)

/* =====================================================
   نسخ رابط الوظيفة
===================================================== */

async function copyJobLink(){

if(!currentJob){
return;
}

const url=
getJobURL(currentJob);

try{

await navigator.clipboard.writeText(url);

showToast(
"🔗 تم نسخ رابط الوظيفة"
);

}catch(error){

const temp=
document.createElement("input");

temp.value=url;

document.body.appendChild(temp);

temp.select();

document.execCommand("copy");

temp.remove();

showToast(
"🔗 تم نسخ رابط الوظيفة"
);

}

}


/* =====================================================
   مشاركة الوظيفة
===================================================== */

async function shareJob(){

if(!currentJob){
return;
}

const url=
getJobURL(currentJob);

const shareData={

title:
currentJob.title+
" - Arab Jobs Hub",

text:
"شاهد فرصة العمل: "+
currentJob.title+
" في "+
countries[currentJob.country].name,

url:url

};

if(navigator.share){

try{

await navigator.share(shareData);

}catch(error){}

}else{

await copyJobLink();

}

}


/* =====================================================
   الرابط الخارجي
===================================================== */

function goExternal(){

if(!EXTERNAL_LINK){
return;
}

window.open(
EXTERNAL_LINK,
"_blank",
"noopener,noreferrer"
);

}


/* =====================================================
   إغلاق النافذة
===================================================== */

function closeModal(){

document
.getElementById("modal")
.classList.remove("show");

}


/* =====================================================
   إغلاق عند الضغط خارج النافذة
===================================================== */

document
.getElementById("modal")
.addEventListener(
"click",
function(event){

if(event.target===this){

closeModal();

}

}
);


/* =====================================================
   Toast
===================================================== */

let toastTimer;

function showToast(message){

const toast=
document.getElementById("toast");

clearTimeout(toastTimer);

toast.textContent=
message;

toast.style.display=
"block";

toastTimer=
setTimeout(function(){

toast.style.display=
"none";

},3500);

}


/* =====================================================
   Scroll
===================================================== */

function scrollToJobs(){

document

.scrollIntoView({

behavior:"smooth",

block:"start"

});

}


function focusSearch(){

window.scrollTo({

top:0,

behavior:"smooth"

});

setTimeout(function(){

document
.getElementById("keyword")
.focus();

},400);

}
